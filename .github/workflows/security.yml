name: security

# Controles DevSecOps del plan ITIL y DevOps (docs/deploy/plan-itil-devops/06-seguridad/).
# Corre en cada PR, en main y una vez por semana para detectar CVE nuevas sin cambios de código.
# Nada se publica: las imágenes se construyen solo para analizarlas. Trivy falla solo con
# hallazgos altos o críticos que ya tienen corrección publicada.
# Acciones fijadas por SHA (una etiqueta se puede mover; un SHA no) e imágenes de herramientas
# con versión fija para resultados reproducibles. Dependabot actualiza ambas.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

env:
  TRIVY_IMAGE: aquasec/trivy:0.74.0
  GITLEAKS_IMAGE: zricethezav/gitleaks:v8.30.1

jobs:
  sast:
    name: SAST (CodeQL ${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}

  secrets:
    name: Secretos (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Revisa todo el historial. --redact evita que un valor aparezca en el log.
      # Falsos positivos justificados en .gitleaksignore.
      - name: gitleaks
        run: >
          docker run --rm -v "$PWD:/repo" "$GITLEAKS_IMAGE"
          git /repo --redact --no-banner --exit-code 1

  dependencies:
    name: Dependencias y configuración (Trivy fs, pip-audit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Trivy fs
        run: >
          docker run --rm -v "$PWD:/src" -w /src "$TRIVY_IMAGE"
          fs --scanners vuln,misconfig,secret
          --format sarif --output trivy-fs.sarif
          --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 .
      - name: Subir reporte a la pestaña Security
        if: ${{ !cancelled() && hashFiles('trivy-fs.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: ${{ !cancelled() }}
        with:
          python-version: "3.13"
      # Los requirements usan rangos, que Trivy no evalúa; pip-audit los resuelve.
      - name: pip-audit
        if: ${{ !cancelled() }}
        run: |
          pip install --quiet pip-audit
          pip-audit -r backend/news/requirements.txt
          pip-audit -r backend/assistant/requirements.txt

  images:
    name: Imagen ${{ matrix.service }} (Trivy image)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Mismos comandos de build que deploy/gcp/deploy.sh.
          - service: news-api
            build: docker build -f backend/news/Dockerfile -t scan/news-api .
          - service: news-chatbot
            build: docker build -f backend/assistant/Dockerfile --target runtime -t scan/news-chatbot backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Construir imagen
        run: ${{ matrix.build }}
      - name: Trivy image
        run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/out"
          "$TRIVY_IMAGE" image --scanners vuln,secret
          --format sarif --output /out/trivy-${{ matrix.service }}.sarif
          --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1
          scan/${{ matrix.service }}
      - name: Subir reporte a la pestaña Security
        if: ${{ !cancelled() && hashFiles(format('trivy-{0}.sarif', matrix.service)) != '' }}
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
          category: trivy-image-${{ matrix.service }}

  dast:
    name: DAST (OWASP ZAP sobre la API)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Imagen de Cloud Run + MongoDB efímera con datos demo, en una red Docker interna.
      - name: ZAP API scan
        run: bash scripts/dast-zap.sh
      - name: Guardar reporte
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zap-report
          path: dast-report/
          if-no-files-found: ignore
